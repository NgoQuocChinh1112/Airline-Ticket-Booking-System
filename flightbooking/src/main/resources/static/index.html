<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBooking - Hệ Thống Đặt Vé Máy Bay</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --held: #f59e0b;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        /* Navbar */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .api-config { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
        .api-config input { padding: 4px 8px; background: #0f172a; border: 1px solid var(--border); border-radius: 4px; color: #fff; width: 180px; }

        .container { max-width: 900px; margin: 30px auto; width: 100%; padding: 0 16px; flex: 1; }

        /* Auth Pages (Center Form) */
        .auth-container { max-width: 400px; margin: 50px auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .auth-title { font-size: 20px; font-weight: 600; text-align: center; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }

        button { width: 100%; padding: 10px 16px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: #334155; color: var(--text); width: auto; }
        button.danger { background: var(--danger); width: auto; }
        .auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
        .auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }

        /* User Header Bar */
        .user-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info { font-size: 14px; font-weight: 500; }

        /* Cards & Panels */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; margin-top: 0; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .flight-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .flight-item:hover { border-color: var(--accent); }
        .flight-price { color: var(--success); font-size: 18px; font-weight: 700; text-align: right; }

        /* Seat Grid */
        .seat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 16px 0; }
        .seat { padding: 10px 0; text-align: center; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: #0f172a; border: 1px solid var(--border); }
        .seat.available { color: var(--success); border-color: rgba(16, 185, 129, 0.4); }
        .seat.available:hover { background: var(--success); color: white; }
        .seat.held { background: rgba(245, 158, 11, 0.2); color: var(--held); cursor: not-allowed; }
        .seat.booked { background: #334155; color: var(--muted); cursor: not-allowed; }
        .seat.selected { background: var(--accent); color: white; border-color: var(--accent); }

        .toast { padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 12px; display: none; }
        .toast.success { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); }
        .toast.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); }

        .hidden { display: none !important; }
        .passenger-row { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>

<header>
    <div class="logo">✈️ SkyBooking</div>
    <div class="api-config">
        <span>Backend API:</span>
        <input id="apiUrl" value="http://localhost:3000">
    </div>
</header>

<div class="container">

    <!-- PAGE 1: LOGIN -->
    <div id="loginPage" class="auth-container">
        <h2 class="auth-title">Đăng Nhập</h2>
        <div class="form-group">
            <label>Email</label>
            <input id="loginEmail" value="test@example.com">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input id="loginPassword" type="password" value="123456">
        </div>
        <button onclick="login()">Đăng Nhập</button>
        <div id="loginMsg" class="toast"></div>
        <div class="auth-switch">
            Chưa có tài khoản? <a onclick="showPage('registerPage')">Đăng ký ngay</a>
        </div>
    </div>

    <!-- PAGE 2: REGISTER -->
    <div id="registerPage" class="auth-container hidden">
        <h2 class="auth-title">Đăng Ký Tài Khoản</h2>
        <div class="form-group">
            <label>Họ và tên</label>
            <input id="regFullName" value="Nguyen Van A">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input id="regEmail" value="test@example.com">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input id="regPassword" type="password" value="123456">
        </div>
        <button onclick="register()">Tạo Tài Khoản</button>
        <div id="regMsg" class="toast"></div>
        <div class="auth-switch">
            Đã có tài khoản? <a onclick="showPage('loginPage')">Đăng nhập</a>
        </div>
    </div>

    <!-- PAGE 3: MAIN APP (Flight Search & Booking) -->
    <div id="mainPage" class="hidden">
        <div class="user-bar">
            <div class="user-info">Xin chào, <span id="userEmailDisplay" style="color: var(--accent);"></span> 👋</div>
            <button class="secondary" style="padding: 6px 12px; font-size: 12px;" onclick="logout()">Đăng xuất</button>
        </div>

        <!-- Search Panel -->
        <div class="card">
            <div class="card-title">1. Tìm Kiếm Chuyến Bay</div>
            <div class="grid-3">
                <div>
                    <label>Sân bay đi</label>
                    <select id="source">
                        <option value="HAN" selected>HAN - Hà Nội</option>
                        <option value="SGN">SGN - TP.HCM</option>
                        <option value="DAD">DAD - Đà Nẵng</option>
                    </select>
                </div>
                <div>
                    <label>Sân bay đến</label>
                    <select id="dest">
                        <option value="SGN" selected>SGN - TP.HCM</option>
                        <option value="HAN">HAN - Hà Nội</option>
                        <option value="DAD">DAD - Đà Nẵng</option>
                    </select>
                </div>
                <div>
                    <label>Ngày đi</label>
                    <input id="date" type="date">
                </div>
            </div>
            <button style="margin-top: 14px;" onclick="searchFlights()">Tìm Chuyến Bay</button>
            <div id="searchMsg" class="toast"></div>
            <div id="flightList" style="margin-top: 14px;"></div>
        </div>

        <!-- Seat Panel -->
        <div class="card hidden" id="seatPanel">
            <div class="card-title">2. Chọn Ghế — Chuyến <span id="selectedFlightNumber" style="color:var(--accent)"></span></div>
            <div id="seatGrid" class="seat-grid"></div>
            <div style="font-size: 12px; color: var(--muted); margin-bottom: 12px;">
                <span style="color:var(--success)">■</span> Trống &nbsp;
                <span style="color:var(--held)">■</span> Đang giữ &nbsp;
                <span style="color:var(--muted)">■</span> Đã đặt &nbsp;
                <span style="color:var(--accent)">■</span> Đang chọn
            </div>
            <div id="passengerForm"></div>
            <button style="margin-top: 14px;" onclick="createBooking()">Tạo Booking</button>
            <div id="bookingMsg" class="toast"></div>
        </div>

        <!-- Payment Panel -->
        <div class="card hidden" id="confirmPanel">
            <div class="card-title">3. Thanh Toán Booking</div>
            <p>Mã Booking ID: <code id="bookingIdText" style="color: #a5b4fc;"></code></p>
            <div style="display: flex; gap: 10px;">
                <button style="width: auto;" onclick="confirmBooking()">✅ Thanh Toán Thành Công</button>
                <button class="danger" onclick="cancelBooking()">❌ Hủy Booking</button>
            </div>
            <div id="confirmMsg" class="toast"></div>
        </div>
    </div>

</div>

<script>
    const state = {
        token: null,
        userEmail: null,
        flightId: null,
        flightPrice: 0,
        selectedSeats: [],
        bookingId: null
    };

    const nextDay = new Date();
    nextDay.setDate(nextDay.getDate() + 1);
    document.getElementById('date').valueAsDate = nextDay;

    function apiUrl() { return document.getElementById('apiUrl').value.replace(/\/$/, ''); }

    function showPage(pageId) {
        ['loginPage', 'registerPage', 'mainPage'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(pageId).classList.remove('hidden');
    }

    function showMsg(id, text, isSuccess) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'toast ' + (isSuccess ? 'success' : 'error');
    }

    async function api(path, method, body, auth = false) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
        const res = await fetch(apiUrl() + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || ('Lỗi ' + res.status));
        return data;
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        try {
            const data = await api('/auth/login', 'POST', {
                email: email,
                password: document.getElementById('loginPassword').value
            });
            state.token = data.accessToken;
            state.userEmail = email;
            document.getElementById('userEmailDisplay').textContent = email;
            showPage('mainPage');
        } catch (e) { showMsg('loginMsg', e.message, false); }
    }

    async function register() {
        const email = document.getElementById('regEmail').value;
        try {
            const data = await api('/auth/register', 'POST', {
                email: email,
                password: document.getElementById('regPassword').value,
                fullName: document.getElementById('regFullName').value
            });
            state.token = data.accessToken;
            state.userEmail = email;
            document.getElementById('userEmailDisplay').textContent = email;
            showPage('mainPage');
        } catch (e) { showMsg('regMsg', e.message, false); }
    }

    function logout() {
        state.token = null;
        state.userEmail = null;
        showPage('loginPage');
    }

    async function searchFlights() {
        const list = document.getElementById('flightList');
        list.innerHTML = '';
        try {
            const flights = await api(`/flights/search?sourceAirportCode=${document.getElementById('source').value}&destAirportCode=${document.getElementById('dest').value}&departureDate=${document.getElementById('date').value}`, 'GET');
            if (!flights || flights.length === 0) { showMsg('searchMsg', 'Không tìm thấy chuyến bay.', false); return; }
            showMsg('searchMsg', `Tìm thấy ${flights.length} chuyến bay.`, true);

            flights.forEach(f => {
                const div = document.createElement('div');
                div.className = 'flight-item';
                const fId = f.id || f.flightId;
                const time = new Date(f.departureTime).toLocaleString('vi-VN');
                div.innerHTML = `
                    <div>
                        <strong style="font-size:16px;">${f.flightNumber}</strong>
                        <div style="font-size:13px; color:var(--muted); margin-top:4px;">${f.sourceCode || f.source?.code} → ${f.destCode || f.destination?.code} | ${time}</div>
                    </div>
                    <div>
                        <div class="flight-price">${Number(f.price).toLocaleString('vi-VN')} đ</div>
                        <button class="secondary" style="padding:4px 8px; font-size:12px; margin-top:4px;" onclick="selectFlight('${fId}', '${f.flightNumber}', ${f.price})">Chọn ghế</button>
                    </div>
                `;
                list.appendChild(div);
            });
        } catch (e) { showMsg('searchMsg', e.message, false); }
    }

    async function selectFlight(id, number, price) {
        state.flightId = id;
        state.flightPrice = price;
        state.selectedSeats = [];
        document.getElementById('selectedFlightNumber').textContent = number;
        document.getElementById('seatPanel').classList.remove('hidden');
        document.getElementById('confirmPanel').classList.add('hidden');
        await loadSeats();
    }

    async function loadSeats() {
        const grid = document.getElementById('seatGrid');
        grid.innerHTML = '';
        try {
            const seats = await api(`/flights/${state.flightId}/seats`, 'GET', null, true);
            seats.forEach(s => {
                const div = document.createElement('div');
                const status = (s.status || '').toLowerCase();
                const seatId = s.id || s.seatId;
                div.className = 'seat ' + status;
                div.textContent = s.seatNumber;
                if (status === 'available') {
                    div.onclick = () => toggleSeat(div, seatId);
                }
                grid.appendChild(div);
            });
        } catch (e) { showMsg('bookingMsg', e.message, false); }
    }

    async function toggleSeat(div, seatId) {
        const seatNumber = div.textContent;

        // Nếu ghế đang được chọn -> Bấm lại lần nữa nghĩa là BỎ CHỌN (Nhả ghế)
        if (div.classList.contains('selected')) {
            await releaseSingleSeat(seatId, seatNumber);
            return;
        }

        // Nếu ghế chưa chọn -> Gửi request GIỮ GHẾ (POST /hold-seat)
        try {
            await api('/bookings/hold-seat', 'POST', { flightId: state.flightId, seatId }, true);
            div.classList.add('selected');
            state.selectedSeats.push(seatId);
            showMsg('bookingMsg', `Đã giữ ghế ${seatNumber} trong 15 phút!`, true);
            renderPassengerForm();
        } catch (e) {
            showMsg('bookingMsg', e.message, false);
        }
    }

    // Gọi API DELETE nhả 1 ghế giữ và cập nhật lại sơ đồ ghế
    async function releaseSingleSeat(seatId, seatNumber) {
        try {
            await api('/bookings/' + state.flightId + '/seats/' + seatId + '/hold', 'DELETE', null, true);

            // Cập nhật lại state danh sách ghế đang chọn
            state.selectedSeats = state.selectedSeats.filter(id => id !== seatId);

            showMsg('bookingMsg', 'Đã nhả giữ chỗ ghế ' + seatNumber + ' thành công!', true);

            // Tải lại sơ đồ ghế từ Server để cập nhật màu sắc ghế
            await loadSeats();
            renderPassengerForm();
        } catch (e) {
            showMsg('bookingMsg', 'Lỗi nhả ghế: ' + e.message, false);
        }
    }

    function renderPassengerForm() {
        const form = document.getElementById('passengerForm');
        form.innerHTML = state.selectedSeats.length ? '<label style="margin-top:12px; font-size:13px;">Thông tin hành khách:</label>' : '';
        state.selectedSeats.forEach((_, i) => {
            const row = document.createElement('div');
            row.className = 'passenger-row';
            row.innerHTML = `
                <input placeholder="Họ tên" data-field="fullName" data-index="${i}">
                <input placeholder="Số hộ chiếu/CCCD" data-field="passportNumber" data-index="${i}">
                <input type="date" data-field="dob" data-index="${i}">
            `;
            form.appendChild(row);
        });
    }

    async function createBooking() {
        if (state.selectedSeats.length === 0) { showMsg('bookingMsg', 'Chưa chọn ghế nào.', false); return; }
        const passengers = state.selectedSeats.map((_, i) => ({
            fullName: document.querySelector(`[data-field="fullName"][data-index="${i}"]`)?.value || 'Nguyen Van A',
            passportNumber: document.querySelector(`[data-field="passportNumber"][data-index="${i}"]`)?.value || 'B1234567',
            dob: document.querySelector(`[data-field="dob"][data-index="${i}"]`)?.value || '1995-01-01'
        }));

        try {
            const booking = await api('/bookings', 'POST', { flightId: state.flightId, seatIds: state.selectedSeats, passengers }, true);
            state.bookingId = booking.id || booking.bookingId;
            showMsg('bookingMsg', 'Tạo booking thành công! Trạng thái: PENDING', true);
            document.getElementById('confirmPanel').classList.remove('hidden');
            document.getElementById('bookingIdText').textContent = state.bookingId;
        } catch (e) { showMsg('bookingMsg', e.message, false); }
    }

    async function confirmBooking() {
        if (!state.bookingId) return;
        try {
            await api(`/bookings/${state.bookingId}/confirm`, 'POST', null, true);
            showMsg('confirmMsg', 'Thanh toán thành công! Trạng thái: CONFIRMED', true);
            await loadSeats();
        } catch (e) { showMsg('confirmMsg', e.message, false); }
    }

    async function cancelBooking() {
        if (!state.bookingId) return;
        try {
            await api(`/bookings/${state.bookingId}/cancel`, 'POST', null, true);
            showMsg('confirmMsg', 'Đã hủy booking thành công!', true);
            await loadSeats();
        } catch (e) { showMsg('confirmMsg', e.message, false); }
    }
</script>
</body>
</html>

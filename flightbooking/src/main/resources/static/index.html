<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Đặt Vé Máy Bay</title>
    <style>
        :root{--bg:#0f1720;--panel:#16212c;--line:#26333f;--text:#e7edf3;--muted:#8fa1b3;--accent:#3d8bfd;--ok:#2fbf71;--bad:#e15b5b;--held:#d9a53c}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;max-width:900px;margin:0 auto}
        h1{font-size:20px;font-weight:600;margin:0 0 4px}
        h2{font-size:15px;font-weight:600;color:var(--muted);text-transform:none;margin:0 0 12px}
        .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
        .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
        label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:10px}
        input,select{width:100%;padding:8px 10px;background:#0c141b;border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:14px}
        input:first-child,label:first-child{margin-top:0}
        button{margin-top:14px;padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
        button:hover{opacity:.9}
        button.secondary{background:#2a3742}
        .row{display:flex;gap:10px}
        .row > div{flex:1}
        .msg{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:6px;display:none}
        .msg.ok{display:block;background:rgba(47,191,113,.12);color:var(--ok)}
        .msg.bad{display:block;background:rgba(225,91,91,.12);color:var(--bad)}
        .flight-item{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .flight-item:hover{border-color:var(--accent)}
        .flight-item .num{font-weight:600}
        .flight-item .info{color:var(--muted);font-size:13px}
        .flight-item .price{color:var(--ok);font-weight:600}
        .seat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
        .seat{padding:10px 0;text-align:center;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#0c141b}
        .seat.available:hover{border-color:var(--accent)}
        .seat.booked{background:#26333f;color:var(--muted);cursor:not-allowed}
        .seat.held{background:rgba(217,165,60,.15);color:var(--held);cursor:not-allowed}
        .seat.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
        .hidden{display:none}
        code{background:#0c141b;padding:1px 5px;border-radius:4px;font-size:12px}
        .passenger-row{display:flex;gap:8px;margin-top:8px}
        .passenger-row input{flex:1}
    </style>
</head>
<body>

<h1>✈️ Test Đặt Vé Máy Bay</h1>
<div class="sub">Trang test đơn giản gọi trực tiếp API backend — không đại diện cho giao diện sản phẩm cuối.</div>

<div class="panel">
    <h2>0. Địa chỉ API</h2>
    <label>API URL</label>
    <input id="apiUrl" value="http://localhost:3000">
</div>

<div class="panel">
    <h2>1. Tài khoản</h2>
    <div class="row">
        <div>
            <label>Email</label>
            <input id="email" value="test@example.com">
        </div>
        <div>
            <label>Mật khẩu</label>
            <input id="password" type="password" value="123456">
        </div>
    </div>
    <label>Họ tên (chỉ cần khi đăng ký)</label>
    <input id="fullName" value="Nguyen Van A">
    <button onclick="register()">Đăng ký</button>
    <button class="secondary" onclick="login()">Đăng nhập</button>
    <div id="authMsg" class="msg"></div>
</div>

<div class="panel">
    <h2>2. Tìm chuyến bay</h2>
    <div class="row">
        <div>
            <label>Sân bay đi</label>
            <select id="source">
                <option value="HAN" selected>HAN - Sân bay Nội Bài (Hà Nội)</option>
                <option value="SGN">SGN - Sân bay Tân Sơn Nhất (TP.HCM)</option>
                <option value="DAD">DAD - Sân bay Đà Nẵng (Đà Nẵng)</option>
                <option value="CXR">CXR - Sân bay Cam Ranh (Nha Trang)</option>
                <option value="PQC">PQC - Sân bay Phú Quốc (Phú Quốc)</option>
                <option value="HPH">HPH - Sân bay Cát Bi (Hải Phòng)</option>
                <option value="VCA">VCA - Sân bay Cần Thơ (Cần Thơ)</option>
                <option value="UIH">UIH - Sân bay Phù Cát (Quy Nhơn)</option>
            </select>
        </div>
        <div>
            <label>Sân bay đến</label>
            <select id="dest">
                <option value="SGN" selected>SGN - Sân bay Tân Sơn Nhất (TP.HCM)</option>
                <option value="HAN">HAN - Sân bay Nội Bài (Hà Nội)</option>
                <option value="DAD">DAD - Sân bay Đà Nẵng (Đà Nẵng)</option>
                <option value="CXR">CXR - Sân bay Cam Ranh (Nha Trang)</option>
                <option value="PQC">PQC - Sân bay Phú Quốc (Phú Quốc)</option>
                <option value="HPH">HPH - Sân bay Cát Bi (Hải Phòng)</option>
                <option value="VCA">VCA - Sân bay Cần Thơ (Cần Thơ)</option>
                <option value="UIH">UIH - Sân bay Phù Cát (Quy Nhơn)</option>
            </select>
        </div>
        <div>
            <label>Ngày đi</label>
            <input id="date" type="date">
        </div>
    </div>
    <button onclick="searchFlights()">Tìm chuyến bay</button>
    <div id="searchMsg" class="msg"></div>
    <div id="flightList" style="margin-top:12px"></div>
</div>

<div class="panel hidden" id="seatPanel">
    <h2>3. Chọn ghế — chuyến <span id="selectedFlightNumber"></span></h2>
    <div id="seatGrid" class="seat-grid"></div>
    <div style="font-size:12px;color:var(--muted)">
        <span style="color:var(--held)">■</span> đang giữ &nbsp;
        <span style="color:var(--muted)">■</span> đã đặt &nbsp;
        <span style="color:var(--accent)">■</span> bạn đang chọn
    </div>
    <div id="passengerForm"></div>
    <button onclick="createBooking()">Tạo booking</button>
    <div id="bookingMsg" class="msg"></div>
</div>

<div class="panel hidden" id="confirmPanel">
    <h2>4. Thanh toán (giả lập)</h2>
    <div>Booking ID: <code id="bookingIdText"></code></div>
    <button onclick="confirmBooking()">✅ Giả lập thanh toán thành công</button>
    <button class="secondary" onclick="cancelBooking()">❌ Hủy booking</button>
    <div id="confirmMsg" class="msg"></div>
</div>

<script>
    let state = { token: null, flightId: null, flightPrice: 0, selectedSeats: [], bookingId: null };

    document.getElementById('date').valueAsDate = new Date(Date.now() + 24*3600*1000);

    function apiUrl(){ return document.getElementById('apiUrl').value.replace(/\/$/,''); }

    function showMsg(id, text, ok){
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'msg ' + (ok ? 'ok' : 'bad');
    }

    async function api(path, method, body, auth){
        const headers = {'Content-Type':'application/json'};
        if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
        const res = await fetch(apiUrl() + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || ('Lỗi ' + res.status));
        return data;
    }

    async function register(){
        try {
            const data = await api('/auth/register', 'POST', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                fullName: document.getElementById('fullName').value,
            });
            state.token = data.accessToken;
            showMsg('authMsg', 'Đăng ký thành công, đã đăng nhập luôn.', true);
        } catch(e){ showMsg('authMsg', e.message, false); }
    }

    async function login(){
        try {
            const data = await api('/auth/login', 'POST', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            });
            state.token = data.accessToken;
            showMsg('authMsg', 'Đăng nhập thành công.', true);
        } catch(e){ showMsg('authMsg', e.message, false); }
    }

    async function searchFlights(){
        const list = document.getElementById('flightList');
        list.innerHTML = '';
        try {
            const flights = await api(`/flights/search?sourceAirportCode=${document.getElementById('source').value}&destAirportCode=${document.getElementById('dest').value}&departureDate=${document.getElementById('date').value}`, 'GET');
            if (flights.length === 0){ showMsg('searchMsg', 'Không tìm thấy chuyến bay nào ngày này.', false); return; }
            showMsg('searchMsg', `Tìm thấy ${flights.length} chuyến bay.`, true);
            flights.forEach(f => {
                const div = document.createElement('div');
                div.className = 'flight-item';
                const src = f.source ? f.source.code : f.sourceCode;
                const dst = f.destination ? f.destination.code : f.destCode;
                const time = new Date(f.departureTime).toLocaleString('vi-VN');
                div.innerHTML = `<div><div class="num">${f.flightNumber}</div><div class="info">${src} → ${dst} · ${time} · còn ${f.availableSeats} ghế</div></div><div class="price">${Number(f.price).toLocaleString('vi-VN')}đ</div>`;
                div.onclick = () => selectFlight(f.id, f.flightNumber, f.price);
                list.appendChild(div);
            });
        } catch(e){ showMsg('searchMsg', e.message, false); }
    }

    async function selectFlight(id, number, price){
        state.flightId = id;
        state.flightPrice = price;
        state.selectedSeats = [];
        document.getElementById('selectedFlightNumber').textContent = number;
        document.getElementById('seatPanel').classList.remove('hidden');
        document.getElementById('confirmPanel').classList.add('hidden');
        await loadSeats();
    }

    async function loadSeats(){
        const grid = document.getElementById('seatGrid');
        grid.innerHTML = '';
        const seats = await api(`/flights/${state.flightId}/seats`, 'GET');
        seats.forEach(s => {
            const div = document.createElement('div');
            const status = s.status.toLowerCase();
            div.className = 'seat ' + status;
            div.textContent = s.seatNumber;
            div.dataset.id = s.id;
            if (status === 'available'){
                div.onclick = () => toggleSeat(div, s.id);
            }
            grid.appendChild(div);
        });
    }

    async function toggleSeat(div, seatId){
        if (!state.token){ showMsg('bookingMsg', 'Bạn cần đăng nhập trước khi giữ ghế.', false); return; }
        if (div.classList.contains('selected')){
            div.classList.remove('selected');
            state.selectedSeats = state.selectedSeats.filter(id => id !== seatId);
            renderPassengerForm();
            return;
        }
        try {
            await api('/bookings/hold-seat', 'POST', { flightId: state.flightId, seatId }, true);
            div.classList.add('selected');
            state.selectedSeats.push(seatId);
            showMsg('bookingMsg', `Đã giữ ghế ${div.textContent} trong 15 phút.`, true);
            renderPassengerForm();
        } catch(e){ showMsg('bookingMsg', e.message, false); }
    }

    function renderPassengerForm(){
        const form = document.getElementById('passengerForm');
        form.innerHTML = state.selectedSeats.length ? '<label>Thông tin hành khách (theo thứ tự ghế đã chọn)</label>' : '';
        state.selectedSeats.forEach((seatId, i) => {
            const row = document.createElement('div');
            row.className = 'passenger-row';
            row.innerHTML = `
      <input placeholder="Họ tên" data-field="fullName" data-index="${i}">
      <input placeholder="Số hộ chiếu" data-field="passportNumber" data-index="${i}">
      <input type="date" data-field="dob" data-index="${i}">`;
            form.appendChild(row);
        });
    }

    async function createBooking(){
        if (state.selectedSeats.length === 0){ showMsg('bookingMsg', 'Chọn ít nhất 1 ghế trước.', false); return; }
        const passengers = state.selectedSeats.map((_, i) => ({
            fullName: document.querySelector(`[data-field=fullName][data-index="${i}"]`).value,
            passportNumber: document.querySelector(`[data-field=passportNumber][data-index="${i}"]`).value,
            dob: document.querySelector(`[data-field=dob][data-index="${i}"]`).value,
        }));
        try {
            const booking = await api('/bookings', 'POST', { flightId: state.flightId, seatIds: state.selectedSeats, passengers }, true);
            state.bookingId = booking.id;
            showMsg('bookingMsg', 'Tạo booking thành công, trạng thái: pending.', true);
            document.getElementById('confirmPanel').classList.remove('hidden');
            document.getElementById('bookingIdText').textContent = booking.id;
        } catch(e){ showMsg('bookingMsg', e.message, false); }
    }

    async function confirmBooking(){
        try {
            await api(`/bookings/${state.bookingId}/confirm`, 'POST', null, false);
            showMsg('confirmMsg', 'Thanh toán thành công! Booking đã confirmed, ghế đã booked.', true);
            loadSeats();
        } catch(e){ showMsg('confirmMsg', e.message, false); }
    }

    async function cancelBooking(){
        try {
            await api(`/bookings/${state.bookingId}/cancel`, 'POST', null, false);
            showMsg('confirmMsg', 'Đã hủy booking, ghế trở lại available.', true);
            loadSeats();
        } catch(e){ showMsg('confirmMsg', e.message, false); }
    }
</script>
</body>
</html>

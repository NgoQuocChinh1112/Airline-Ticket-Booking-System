<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thanh toán</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(440px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #1e293b;
            text-align: center;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <h1 id="title">Đang kiểm tra thanh toán…</h1>
    <p id="message">Vui lòng chờ hệ thống xác nhận vé.</p>
    <a href="/">Quay về SkyBooking</a>
</main>

<script>
    const parameters = new URLSearchParams(window.location.search);
    const paymentCode = parameters.get("vnp_TxnRef");
    const vnpaySucceeded =
        parameters.get("vnp_ResponseCode") === "00" &&
        parameters.get("vnp_TransactionStatus") === "00";

    const title = document.getElementById("title");
    const message = document.getElementById("message");

    if (!vnpaySucceeded) {
        title.textContent = "Thanh toán chưa thành công";
        message.textContent = "Bạn có thể quay lại SkyBooking để thử lại.";
    } else if (!paymentCode) {
        title.textContent = "Không tìm thấy mã giao dịch";
        message.textContent = "Vui lòng liên hệ bộ phận hỗ trợ.";
    } else {
        title.textContent = "Đang xác nhận vé...";
        message.textContent = "Hệ thống đang nhận kết quả từ VNPay.";

        checkPaymentStatus();
    }

    async function checkPaymentStatus() {
        try {
            const response = await fetch(
                `/payments/vnpay/status/${encodeURIComponent(paymentCode)}`
            );

            if (!response.ok) {
                throw new Error("Không thể kiểm tra trạng thái giao dịch");
            }

            const payment = await response.json();

            if (
                payment.status === "PAID" &&
                payment.bookingStatus === "CONFIRMED"
            ) {
                title.textContent = "Thanh toán thành công";
                message.textContent =
                    "Vé của bạn đã được xác nhận. Mã giao dịch: " +
                    payment.paymentCode;
                return;
            }

            title.textContent = "Đang chờ VNPay xác nhận...";
            message.textContent =
                "Giao dịch đang ở trạng thái " + payment.status + ".";

            setTimeout(checkPaymentStatus, 1500);
        } catch (error) {
            title.textContent = "Không thể kiểm tra giao dịch";
            message.textContent = error.message;
        }
    }
</script>
</body>
</html>

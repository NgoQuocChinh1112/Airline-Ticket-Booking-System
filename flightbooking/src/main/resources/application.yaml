server:
  port: ${PORT:3000}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flight_booking}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # update: tự tạo/cập nhật bảng theo entity - tiện cho môi trường học tập/dev
      # Khi lên production nên đổi sang "validate" và dùng công cụ migration (Flyway/Liquibase)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-change-me-super-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 1 ngày
  seat-hold-seconds: ${SEAT_HOLD_SECONDS:900} # 15 phút
